<!DOCTYPE html>
<html>
<head>

<title>Serengeti NP Crime Dashboard</title>

<meta charset="UTF-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<style>

body{
margin:0;
display:flex;
font-family:Arial;
background:#eef2f5;
}

/* ================= SIDEBAR ================= */

.sidebar{
width:340px;
background:linear-gradient(180deg,#0b3d2e,#145a32,#1e8449);
color:white;
padding:15px;
height:100vh;
overflow:auto;
box-shadow:0 0 15px rgba(0,0,0,0.3);
transition:0.3s;
}

.sidebar.hidden{
margin-left:-370px;
}

/* ================= BUTTONS ================= */

button,select,input,textarea{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:none;
font-size:14px;
box-sizing:border-box;
}

textarea{
resize:vertical;
min-height:80px;
}

button{
background:#27ae60;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#2ecc71;
}

.small-btn{
padding:4px !important;
font-size:11px !important;
width:34px !important;
height:34px !important;
}

/* ================= TOGGLE BUTTON ================= */

#toggleBtn{
position:fixed;
top:10px;
left:10px;
width:34px;
height:34px;
border-radius:50%;
background:#145a32;
color:white;
border:none;
z-index:9999;
cursor:pointer;
font-size:15px;
}

/* ================= SYNC BUTTON ================= */

#syncBtn{
position:fixed;
top:48px;
left:10px;
width:34px;
height:34px;
border-radius:50%;
background:#f39c12;
color:white;
border:none;
z-index:9999;
cursor:pointer;
font-size:14px;
}

/* ================= MAP ================= */

#map{
flex:1;
height:100vh;
}

.roleBox{
background:#ffd700;
color:black;
padding:10px;
text-align:center;
border-radius:10px;
margin-bottom:15px;
font-size:18px;
font-weight:bold;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
border:1px solid white;
}

.admin-only{
display:none;
}

.popup-img{
width:100%;
max-height:180px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
border:2px solid #145a32;
}

.perm-icon{
font-size:20px;
text-shadow:0 0 3px black;
}

.section{
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:10px;
margin-top:15px;
}

.section h3{
color:#ffd700;
margin-top:0;
}

.measure-box{
background:#111;
padding:8px;
border-radius:8px;
margin-top:10px;
font-size:13px;
color:#00ff90;
text-align:center;
}

.filter-row{
display:flex;
gap:6px;
margin-top:8px;
}

.filter-row input{
margin-top:0;
}

.edit-box{
background:#1b1b1b;
padding:10px;
border-radius:8px;
margin-top:10px;
}

.edit-box h4{
margin:0;
margin-bottom:8px;
color:#ffd700;
}

</style>

</head>

<body>

<button id="toggleBtn" onclick="toggleSidebar()">☰</button>

<button id="syncBtn" onclick="manualSync()">🔄</button>

<div class="sidebar" id="sidebar">

<h2>🦁 Serengeti NP Crime Dashboard</h2>

<div class="roleBox" id="roleBox">
Loading...
</div>

<button onclick="location.href='/crime-form'">
➕ Add Crime
</button>

<button onclick="location.href='/logout'">
🚪 Logout
</button>

<hr>

<div class="admin-only" id="adminPanel">

<div class="section">

<h3>⚙ Admin Controls</h3>

<select id="filterType">
<option value="">ALL INCIDENT TYPES</option>
</select>

<div class="filter-row">
<input type="date" id="startDate">
<input type="date" id="endDate">
</div>

<button onclick="applyFilters()">
📌 Apply Filter
</button>

<button onclick="resetFilters()">
♻ Reset
</button>

<button onclick="toggleHeat()">
🔥 Heatmap
</button>

<button onclick="toggleMeasureMode()">
📏 Measure Distance
</button>

<div class="measure-box" id="measureBox">
Distance: 0 KM
</div>

<button onclick="clearMeasurement()">
❌ Clear Measurement
</button>

<button onclick="exportJSON()">
📥 JSON
</button>

<button onclick="exportGeoJSON()">
📥 GeoJSON
</button>

<button onclick="exportKML()">
📥 KML
</button>

<hr>

<h3>🔍 Duplicate Detection</h3>

<button onclick="checkDuplicates()">
🔎 Scan Duplicate Records
</button>

<div id="duplicateResults"
style="
margin-top:10px;
max-height:250px;
overflow:auto;
background:#111;
padding:10px;
border-radius:8px;
font-size:13px;
">
No scan performed
</div>

</div>

<div class="section">

<h3>📍 Add Permanent Icon</h3>

<input id="perm_name" placeholder="Location Name">

<input id="perm_lat" placeholder="Latitude">

<input id="perm_lng" placeholder="Longitude">

<select id="perm_icon">

<option value="📡">📡 Tower</option>
<option value="🏢">🏢 Ranger Post</option>
<option value="🚓">🚓 Police</option>
<option value="✈">✈ Airstrip</option>
<option value="🏥">🏥 Dispensary</option>
<option value="🚪">🚪 Gate</option>
<option value="⛺">⛺ Camp</option>
<option value="🦁">🦁 Wildlife</option>
<option value="🐘">🐘 Elephant Zone</option>
<option value="🐃">🐃 Buffalo Area</option>
<option value="🌳">🌳 Forest</option>
<option value="🔥">🔥 Fire Point</option>
<option value="💧">💧 Water Source</option>
<option value="🚁">🚁 Helipad</option>
<option value="🚧">🚧 Restricted Area</option>
<option value="⚠">⚠ Danger Zone</option>
<option value="📍">📍 Marker</option>
<option value="⭐">⭐ Important Point</option>
<option value="🔭">🔭 Observation Point</option>
<option value="🛑">🛑 Checkpoint</option>

</select>

<input id="custom_icon" placeholder="Custom icon">

<button onclick="savePermanentMarker()">
💾 Save Permanent Icon
</button>

</div>

</div>

</div>

<div id="map"></div>

<script>

/* ================= SIDEBAR TOGGLE ================= */

function toggleSidebar(){

document.getElementById("sidebar").classList.toggle("hidden");

setTimeout(()=>{
map.invalidateSize();
},300);

}

/* ================= MANUAL SYNC ================= */

async function manualSync(){

if(!navigator.onLine){
alert("No internet connection");
return;
}

try{

await autoSync();

alert("Synchronization completed");

}catch(err){

alert("Synchronization failed");

}

}

/* ================= ONLINE/OFFLINE DOT ================= */

const statusDot = document.createElement("div");

statusDot.style.position = "fixed";
statusDot.style.top = "90px";
statusDot.style.right = "10px";
statusDot.style.width = "12px";
statusDot.style.height = "12px";
statusDot.style.borderRadius = "50%";
statusDot.style.border = "2px solid white";
statusDot.style.zIndex = "9999";

document.body.appendChild(statusDot);

function updateConnectionStatus(){

if(navigator.onLine){
statusDot.style.background = "#00ff00";
}else{
statusDot.style.background = "#ff0000";
}

}

window.addEventListener('online', updateConnectionStatus);

window.addEventListener('offline', updateConnectionStatus);

updateConnectionStatus();

/* ================= MAP ================= */

let map = L.map('map').setView([-2.5,34.9],7);

let osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

let satellite = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
);

let labels = L.tileLayer(
'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'
);

let hybrid = L.layerGroup([
satellite,
labels
]);

L.control.layers({
"🗺 OSM":osm,
"🛰 Satellite":satellite,
"🌍 Labels":labels,
"🌐 Hybrid":hybrid
}).addTo(map);

/* ================= USER ================= */

let role="";

fetch('/session-user')
.then(r=>r.json())
.then(u=>{

role=u.role;

document.getElementById("roleBox").innerText =
role==="admin" ? "ADMIN" : "USER";

if(role==="admin"){
document.getElementById("adminPanel").style.display="block";
}

});

/* ================= DATA ================= */

let allData=[];
let layer;
let heatLayer;

/* ================= ICON ================= */

function icon(t){

let c="green";

if(t?.includes("Poaching")) c="red";
else if(t?.includes("Fishing")) c="blue";
else if(t?.includes("Logging")) c="brown";
else if(t?.includes("Mining")) c="gray";
else if(t?.includes("Trafficking")) c="purple";
else if(t?.includes("Grazing")) c="orange";
else if(t?.includes("Arson")) c="black";
else if(t?.includes("Conflict")) c="yellow";
else if(t?.includes("Encroachment")) c="pink";
else if(t?.includes("Smuggling")) c="cyan";

return L.divIcon({
html:`<div class="dot" style="background:${c}"></div>`,
iconSize:[8,8],
iconAnchor:[4,4]
});

}

/* ================= GEOFENCE ================= */

let geofence;

fetch('/serengeti_boundary.geojson')
.then(r=>r.json())
.then(g=>{

geofence = L.geoJSON(g,{
style:{
color:"#00ff00",
weight:3,
fillOpacity:0.2
}
}).addTo(map);

})
.catch(err=>{
console.log("GEOFENCE ERROR:",err);
});

/* ================= LOAD DATA ================= */

async function loadData(){

allData = await (await fetch('/criminals')).json();

render(allData);

loadTypes();

loadOfflineData();

}

loadData();

/* ================= RENDER ================= */

function render(d){

if(layer){
map.removeLayer(layer);
layer=null;
}

layer=L.layerGroup().addTo(map);

d.forEach(c=>{

if(!c.coord_lat || !c.coord_lng) return;

L.marker(
[c.coord_lat,c.coord_lng],
{
icon:icon(c.case_type)
}
)

.addTo(layer)

.bindPopup(`

<div style="min-width:260px;">

${c.photo ? `
<img src="${c.photo}" class="popup-img">
` : ''}

<h3>${c.full_name || "Unknown Person"}</h3>

<hr>

<b>Crime:</b> ${c.case_type || "-"}<br>
<b>NIN:</b> ${c.nin || "-"}<br>
<b>Village:</b> ${c.village || "-"}<br>
<b>Region:</b> ${c.region || "-"}<br>
<b>Case Number:</b> ${c.case_number || "-"}<br>
<b>Status:</b> ${c.court_status || "-"}<br>
<b>Date:</b> ${c.created_at || c.date || "-"}<br>
<b>Latitude:</b> ${c.coord_lat || "-"}<br>
<b>Longitude:</b> ${c.coord_lng || "-"}<br>

${c.description ? `
<hr>
<b>Description:</b><br>
${c.description}
<br>
` : ''}

${role==="admin" ? `

<div class="edit-box">

<h4>✏ Edit Incident</h4>

<input id="edit_name_${c.id}" value="${c.full_name || ''}" placeholder="Full Name">

<input id="edit_nin_${c.id}" value="${c.nin || ''}" placeholder="NIN">

<input id="edit_case_${c.id}" value="${c.case_type || ''}" placeholder="Case Type">

<input id="edit_village_${c.id}" value="${c.village || ''}" placeholder="Village">

<input id="edit_region_${c.id}" value="${c.region || ''}" placeholder="Region">

<input id="edit_status_${c.id}" value="${c.court_status || ''}" placeholder="Court Status">

<textarea id="edit_desc_${c.id}" placeholder="Description">${c.description || ''}</textarea>

<button
onclick="updateCrime(${c.id})"
style="background:#2980b9;color:white;">
💾 SAVE CHANGES
</button>

<button
onclick="deleteCrime(${c.id})"
style="background:red;color:white;">
🗑 DELETE INCIDENT
</button>

</div>

` : ''}

</div>

`);

});

}

/* ================= UPDATE INCIDENT ================= */

async function updateCrime(id){

let payload = {

full_name:
document.getElementById(`edit_name_${id}`).value,

nin:
document.getElementById(`edit_nin_${id}`).value,

case_type:
document.getElementById(`edit_case_${id}`).value,

village:
document.getElementById(`edit_village_${id}`).value,

region:
document.getElementById(`edit_region_${id}`).value,

court_status:
document.getElementById(`edit_status_${id}`).value,

description:
document.getElementById(`edit_desc_${id}`).value

};

try{

let r = await fetch('/criminals/' + id,{
method:'PUT',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(payload)
});

let d = await r.json();

if(d.success){

alert("Incident updated successfully");

loadData();

}else{

alert(d.error || "Update failed");

}

}catch(err){

alert("Update failed");

}

}

/* ================= DELETE CRIME ================= */

async function deleteCrime(id){

if(!confirm("Delete this incident?")) return;

let r = await fetch('/criminals/'+id,{
method:'DELETE'
});

let d = await r.json();

if(d.success){

alert("Deleted");

loadData();

}else{

alert(d.error || "Delete failed");

}

}

/* ================= DUPLICATE DETECTION ================= */

function checkDuplicates(){

let resultBox =
document.getElementById("duplicateResults");

let duplicates = [];

for(let i=0;i<allData.length;i++){

for(let j=i+1;j<allData.length;j++){

let a = allData[i];
let b = allData[j];

let sameName = false;
let sameNIN = false;

if(
a.full_name &&
b.full_name &&
a.full_name.trim().toLowerCase() ===
b.full_name.trim().toLowerCase()
){
sameName = true;
}

if(
a.nin &&
b.nin &&
a.nin.trim() !== "" &&
a.nin === b.nin
){
sameNIN = true;
}

if(sameName || sameNIN){

duplicates.push({
a,b,sameName,sameNIN
});

}

}

}

if(duplicates.length===0){

resultBox.innerHTML = `
<div style="color:#00ff90;">
✅ No duplicate records detected
</div>
`;

return;

}

let html = `
<div style="color:orange;font-weight:bold;">
⚠ ${duplicates.length} Possible Duplicate(s) Found
</div>
<hr>
`;

duplicates.forEach((d,index)=>{

html += `

<div style="
margin-bottom:12px;
padding:8px;
background:#222;
border-radius:8px;
">

<b>Record ${index+1}</b>

<hr>

<b>Name 1:</b>
${d.a.full_name || "-"}<br>

<b>Name 2:</b>
${d.b.full_name || "-"}<br>

<b>NIN 1:</b>
${d.a.nin || "-"}<br>

<b>NIN 2:</b>
${d.b.nin || "-"}<br>

<b>Duplicate Type:</b>

${d.sameName ? `
<span style="color:#ffcc00;">
NAME MATCH
</span>
` : ''}

${d.sameNIN ? `
<span style="color:#ff4444;">
NIN MATCH
</span>
` : ''}

</div>

`;

});

resultBox.innerHTML = html;

}

/* ================= FILTER ================= */

function loadTypes(){

let s = document.getElementById("filterType");

s.innerHTML =
`<option value="">ALL TYPES</option>`;

let uniqueTypes = [...new Set(
allData
.map(x=>x.case_type)
.filter(Boolean)
)];

uniqueTypes.forEach(t=>{

s.innerHTML += `<option value="${t}">${t}</option>`;

});

}

function applyFilters(){

let t = document.getElementById("filterType").value;

let startDate = document.getElementById("startDate").value;

let endDate = document.getElementById("endDate").value;

let filtered = allData.filter(c=>{

let typeMatch = !t || c.case_type===t;

let recordDate =
(c.created_at || c.date || "").split("T")[0];

let startMatch =
!startDate || recordDate >= startDate;

let endMatch =
!endDate || recordDate <= endDate;

return typeMatch && startMatch && endMatch;

});

render(filtered);

}

function resetFilters(){

document.getElementById("filterType").value = "";
document.getElementById("startDate").value = "";
document.getElementById("endDate").value = "";

render(allData);

}

/* ================= HEATMAP ================= */

function toggleHeat(){

if(heatLayer){

map.removeLayer(heatLayer);

heatLayer = null;

return;

}

heatLayer = L.heatLayer(

allData

.filter(c=>c.coord_lat && c.coord_lng)

.map(c=>[
c.coord_lat,
c.coord_lng,
1
]),

{
radius:20
}

).addTo(map);

}

/* ================= DISTANCE MEASUREMENT ================= */

let measureMode = false;
let measurePoints = [];
let measureMarkers = [];
let measureLine = null;

function toggleMeasureMode(){

measureMode = !measureMode;

if(measureMode){

alert("Measurement ON\nClick two points on map");

}else{

alert("Measurement OFF");

}

}

map.on('click', function(e){

if(!measureMode) return;

measurePoints.push(e.latlng);

let marker = L.marker(e.latlng).addTo(map);

measureMarkers.push(marker);

if(measurePoints.length === 2){

if(measureLine){
map.removeLayer(measureLine);
}

measureLine = L.polyline(measurePoints,{
color:'red',
weight:3
}).addTo(map);

let distance =
measurePoints[0].distanceTo(measurePoints[1]);

let km = (distance / 1000).toFixed(2);

document.getElementById("measureBox").innerHTML =
"Distance: " + km + " KM";

measureMode = false;

}

});

function clearMeasurement(){

measurePoints = [];

measureMarkers.forEach(m=>{
map.removeLayer(m);
});

measureMarkers = [];

if(measureLine){
map.removeLayer(measureLine);
measureLine = null;
}

document.getElementById("measureBox").innerHTML =
"Distance: 0 KM";

}

/* ================= EXPORTS ================= */

function exportJSON(){

download(
"crime-data.json",
JSON.stringify(allData)
);

}

function exportGeoJSON(){

let geo = {

type:"FeatureCollection",

features:

allData

.filter(c=>c.coord_lat && c.coord_lng)

.map(c=>({

type:"Feature",

geometry:{
type:"Point",
coordinates:[
c.coord_lng,
c.coord_lat
]
},

properties:c

}))

};

download(
"crime-data.geojson",
JSON.stringify(geo)
);

}

function exportKML(){

let kml =
`<?xml version="1.0"?>
<kml>
<Document>`;

allData.forEach(c=>{

if(!c.coord_lat || !c.coord_lng) return;

kml += `

<Placemark>
<name>${c.case_type}</name>
<Point>
<coordinates>
${c.coord_lng},
${c.coord_lat}
</coordinates>
</Point>
</Placemark>

`;

});

kml += `</Document></kml>`;

download("crime-data.kml",kml);

}

function download(name,data){

let a=document.createElement("a");

a.href =
URL.createObjectURL(
new Blob([data])
);

a.download=name;

a.click();

}

</script>

<script src="offline.js"></script>

<script>

async function loadOfflineData(){

try{

const offlineCrimes = await getOfflineCrimes();

if(offlineCrimes.length > 0){

allData = [...offlineCrimes, ...allData];

render(allData);

loadTypes();

}

}catch(err){

console.log("Offline load failed", err);

}

}

async function autoSync(){

if(!navigator.onLine) return;

try{

await synchronizeData();

console.log("Synchronization completed");

}catch(err){

console.log("Sync failed", err);

}

}

window.addEventListener('online', autoSync);

</script>

</body>
</html>
