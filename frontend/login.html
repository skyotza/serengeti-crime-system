<!DOCTYPE html>
<html>
<head>

<title>Serengeti NP Login</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b3d0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
border-radius:10px;
width:320px;
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
}

button{
background:green;
color:white;
border:none;
cursor:pointer;
}

h2{
text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h2>Serengeti NP Login</h2>

<form method="POST" action="/login">

<input
type="text"
name="username"
placeholder="Username"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
LOGIN
</button>

</form>

</div>

</body>
</html>
